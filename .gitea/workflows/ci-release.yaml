name: ci-release

"on":
  # Automatic VPS CI and release runs are paused. Use workflow_dispatch to run manually.
  # Do not add pull_request here until these labels use a verified isolated runner.
  # Manual verification must start from main; release_tag selects a validated tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to validate or publish
        required: false
        type: string
      publish_linux:
        description: Publish the selected release tag as Linux release assets
        required: false
        default: false
        type: boolean
      publish_arch:
        description: Publish the selected release tag to the Arch registry
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: folderscope-release-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: workstation-build
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout CI tools from the workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false

      - name: Validate selected release ref
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-${GITHUB_REF##*/}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${tag#v}" = "$(tr -d '[:space:]' < VERSION)"
          git show-ref --verify --quiet "refs/tags/${tag}"
          tag_commit="$(git rev-parse "${tag}^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          main_commit="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          git merge-base --is-ancestor "$tag_commit" "$main_commit"

      - name: Require a release tag for manual publication
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_arch || inputs.publish_linux)
        shell: bash
        run: test -n "$RELEASE_TAG"

      - name: Configure release build
        shell: bash
        run: .ci-tools/scripts/run-ci-container.sh "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release"

      - name: Build
        shell: bash
        run: .ci-tools/scripts/run-ci-container.sh "cmake --build build --parallel 1"

      - name: Run tests
        shell: bash
        run: .ci-tools/scripts/run-ci-container.sh "ctest --test-dir build --output-on-failure"

      - name: Smoke test GUI
        shell: bash
        run: |
          # shellcheck disable=SC2016 # Expanded by the shell inside the container.
          .ci-tools/scripts/run-ci-container.sh \
            'set +e; timeout 3s ./build/folderscope; status="$?"; test "$status" = 0 || test "$status" = 124'

      - name: Verify Linux binary
        shell: bash
        run: test -x build/folderscope

      - name: Lint workflows and shell scripts
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(bash .ci-tools/scripts/install-ci-tools.sh actionlint shellcheck yamllint)"
          export PATH="$tools_dir:$PATH"
          cd .ci-tools
          yamllint -c .yamllint .gitea
          # Gitea uses code and releases scopes in addition to GitHub scopes.
          actionlint -config-file .gitea/actionlint.yaml \
            -ignore 'unknown permission scope "(code|releases)"' .gitea/workflows/*.yaml
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --external-sources --source-path=SCRIPTDIR "${scripts[@]}"

  publish-linux-amd64:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_linux
    needs: verify
    runs-on: workstation-build
    timeout-minutes: 30
    permissions:
      code: read
      releases: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout CI tools from the workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false

      - name: Configure release build
        shell: bash
        run: .ci-tools/scripts/run-ci-container.sh "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release"

      - name: Build
        shell: bash
        run: .ci-tools/scripts/run-ci-container.sh "cmake --build build --parallel 1"

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          generation="${GITHUB_SHA:0:12}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          package="folderscope-${version}-linux-amd64-${generation}"
          rm -rf dist package
          # shellcheck disable=SC2016 # Expanded by the shell inside the container.
          .ci-tools/scripts/run-ci-container.sh 'cmake --install build --prefix "$PWD/package/usr"'
          mkdir -p "package/${package}"
          mv package/usr "package/${package}/"
          cp README.md CHANGELOG.md VERSION "package/${package}/"
          mkdir -p dist
          archive="${package}.tar.gz"
          tar -C package -czf "dist/${archive}" "${package}"
          (cd dist && sha256sum "$archive" > "${archive}.sha256")

      - name: Create Gitea release
        id: release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          release_url="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases"
          release_id="$(.ci-tools/scripts/create-gitea-release.sh "$release_url" "$tag" "$(git rev-parse HEAD)")"
          test -n "$release_id" && test "$release_id" != "null"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Upload Gitea release assets
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          .ci-tools/scripts/upload-release-assets.sh \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            "$RELEASE_ID" dist

  publish-arch-package:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_arch
    needs: verify
    runs-on: workstation-build
    timeout-minutes: 30
    permissions:
      code: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout CI tools from the workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false

      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-${GITHUB_REF##*/}}"
          version="${tag#v}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${tag}^{commit}")"
          test "$version" = "$(tr -d '[:space:]' < VERSION)"
          git archive --format=tar.gz --prefix="folderscope-${version}/" "${tag}^{commit}" \
            > "packaging/arch/folderscope-${version}.tar.gz"
          .ci-tools/scripts/run-ci-container.sh \
            'cd packaging/arch && makepkg --noconfirm --force'

      - name: Publish to Gitea Arch registry
        shell: bash
        env:
          FOLDERSCOPE_PACKAGE_TOKEN: ${{ secrets.FOLDERSCOPE_PACKAGE_TOKEN }}
        run: |
          set -euo pipefail
          package_file="$(find packaging/arch -maxdepth 1 -type f \
            -name 'folderscope-[0-9]*.pkg.tar.zst' -print -quit)"
          test -n "$package_file"
          .ci-tools/scripts/publish-arch-package.sh \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY_OWNER" folderscope "$package_file"

  summary:
    name: Release summary
    if: always()
    needs: [verify, publish-linux-amd64, publish-arch-package]
    runs-on: vps-pr
    timeout-minutes: 5
    steps:
      - name: Report release job results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          results = json.loads(os.environ['JOB_RESULTS'])
          lines = ['## Release results', '', '| Job | Result |', '| --- | --- |']
          for name, job in results.items():
              lines.append(f"| {name} | {job['result']} |")
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          allowed_skips = ['publish-linux-amd64', 'publish-arch-package']
          if any(job['result'] != 'success' and not (name in allowed_skips and job['result'] == 'skipped')
                 for name, job in results.items()):
              raise SystemExit(1)
          PYTHON
