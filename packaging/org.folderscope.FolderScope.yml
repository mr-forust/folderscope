app-id: org.folderscope.FolderScope
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: folderscope
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: folderscope
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ..
